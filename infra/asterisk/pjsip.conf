; Templates only. No fictitious extensions or users are provisioned.
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0
allow_reload=yes

[operator-template](!)
type=endpoint
disallow=all
allow=opus,ulaw
context=portaria-operators
webrtc=yes
dtls_auto_generate_cert=no
dtls_cert_file=/run/secrets/asterisk-fullchain.pem
dtls_private_key=/run/secrets/asterisk-key.pem
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; Each REAL endpoint must set its own auth, aors and tenant-specific context.

[aor-template](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

#tryinclude pjsip-clients.conf
