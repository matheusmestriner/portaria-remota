[general]
static=yes
writeprotect=yes

; There is deliberately no default route to another tenant or external trunk.
[default]
exten => _X.,1,Hangup(21)

; Real per-company contexts must route only the company's intercoms to assigned
; operators. Send ringing/answered/ended/missed events with the authenticated
; webhook contract in docs/integrations.md. Never call shell commands built from
; caller-supplied SIP headers or caller IDs.
#tryinclude extensions-clients.conf

[portaria-operators]
exten => _X.,1,NoOp(Invalid or unprovisioned operator destination)
 same => n,Hangup(3)

[portaria-queue]
exten => s,1,Answer()
 same => n,Set(__PORTARIA_CALL_ID=${UNIQUEID})
 same => n,Set(CHANNEL(hangup_handler_push)=portaria-hangup,s,1)
 same => n,Queue(${ARG1},tT,,,${ARG2})
 same => n,Hangup()

[portaria-hangup]
exten => s,1,NoOp(Portaria call ended ${PORTARIA_CALL_ID})
 same => n,Gosub(portaria-notify,s,1(${PORTARIA_ACCESS_ID},ended,${PORTARIA_CALL_ID}))
 same => n,Return()

[portaria-notify]
; Invoke from trusted per-access dialplan: Gosub(portaria-notify,s,1(ACCESS_UUID,ringing,CALL_ID))
; Invoke answered from Dial's answer subroutine, ended from the hangup handler,
; and missed when DIALSTATUS is NOANSWER/BUSY/CHANUNAVAIL.
exten => s,1,UserEvent(PortariaCall,Access: ${ARG1},Kind: ${ARG2},CallID: ${ARG3})
 same => n,Return()
