services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: portaria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run env:init}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portaria"]
      interval: 5s
      retries: 15
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8080
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro", "keycloak-data:/opt/keycloak/data"]
volumes:
  postgres-data:
  redis-data:
  keycloak-data:
